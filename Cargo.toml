[package]
name = "udp2raw"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Multi-transport UDP tunnel with authenticated path failover"

[dependencies]
libc = "0.2"
chacha20poly1305 = "0.10"
getrandom = "0.2"
sha2 = "0.10"
pbkdf2 = "0.12"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[profile.release]
lto = "thin"
strip = true
