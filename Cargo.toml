[package]
name = "udp2raw"
version = "1.3.0"
edition = "2021"
license = "MIT"
description = "Multi-transport UDP tunnel with authenticated path failover"

[dependencies]
aes = "0.8"
hkdf = "0.12"
md-5 = "0.10"
hmac = "0.12"
sha1 = "0.10"
crc32fast = "1"
libc = "0.2"
chacha20poly1305 = "0.10"
getrandom = "0.2"
sha2 = "0.10"
pbkdf2 = "0.12"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }

[profile.release]
lto = "thin"
strip = true

[features]
pcap-client = ["dep:pcap"]

[target.'cfg(target_os = "linux")'.dependencies]
pcap = { version = "2.3", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
pcap = "2.3"
