# Run with ./udp2raw --conf-file example.conf.
# Set UDP2RAW_KEY in the environment, or add a "-k shared secret" line here
# and limit the file permissions to the account running the tunnel.
-c
-l 127.0.0.1:3333
-r 192.0.2.1:4096
--protocols faketcp,udp,icmp
--threads 4
# Optional maximum application UDP payload in bytes, in both directions.
# --mtu 1382
--heartbeat-ms 1000
--timeout-ms 5000
